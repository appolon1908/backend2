name: Build and deploy Codestra stack

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after publishing
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}

  deploy:
    if: inputs.deploy
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload manifests
        run: scp deploy/Caddyfile deploy/compose.production.yaml "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/srv/codestra/"
      - name: Back up and deploy
        env:
          BACKEND_IMAGE: ${{ needs.publish.outputs.image }}
          FRONTEND_IMAGE: ${{ vars.FRONTEND_IMAGE }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "cd /srv/codestra && set -eu && mkdir -p backups && test -f .env && if FRONTEND_IMAGE='$FRONTEND_IMAGE' BACKEND2_IMAGE='$BACKEND_IMAGE' docker compose -f compose.production.yaml ps --status running db | grep -q db; then FRONTEND_IMAGE='$FRONTEND_IMAGE' BACKEND2_IMAGE='$BACKEND_IMAGE' docker compose -f compose.production.yaml exec -T db pg_dump -U \"\$POSTGRES_USER\" \"\$POSTGRES_DB\" | gzip > backups/predeploy-${GITHUB_SHA}.sql.gz; fi && FRONTEND_IMAGE='$FRONTEND_IMAGE' BACKEND2_IMAGE='$BACKEND_IMAGE' docker compose -f compose.production.yaml pull && FRONTEND_IMAGE='$FRONTEND_IMAGE' BACKEND2_IMAGE='$BACKEND_IMAGE' docker compose -f compose.production.yaml up -d --wait"
