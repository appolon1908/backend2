name: Backend PostgreSQL regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-postgres-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-regression:
    name: PostgreSQL regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chat_test
          POSTGRES_PASSWORD: synthetic-ci-database-only
          POSTGRES_DB: chat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chat_test -d chat_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      DJANGO_SETTINGS_MODULE: CORE.leadconnector_pg_test_settings
      SECRET_KEY: synthetic-ci-only-secret-key-more-than-fifty-characters
      ALLOWED_HOSTS: localhost,testserver
      CSRF_TRUSTED_ORIGINS: http://localhost
      CORS_ALLOWED_ORIGINS: http://localhost
      POSTGRES_DB: chat_test
      POSTGRES_USER: chat_test
      POSTGRES_PASS: synthetic-ci-database-only
      PG_HOST: localhost
      PG_PORT: "5432"
      LC_PG_HOST: localhost
      LC_PG_PASSWORD: synthetic-ci-database-only
      LEADCONNECTOR_ENABLED: "false"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify PostgreSQL configuration and schema
        run: |
          python -c "import django; django.setup(); from django.db import connection; assert connection.vendor == 'postgresql'"
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Full backend suite including concurrent webhook delivery
        run: python manage.py test --noinput
