services:
  web:
    image: ${BACKEND2_IMAGE:-codestra-backend2:local}
    build: .
    restart: unless-stopped
    init: true
    env_file: [.env]
    environment:
      PG_HOST: db
      PG_PORT: 5432
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      RUN_MIGRATIONS: "1"
      COLLECT_STATIC: "1"
    volumes:
      - static_data:/app/static
      - media_data:/app/media
    expose: ["8000"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    networks: [codestra]

  celery:
    image: ${BACKEND2_IMAGE:-codestra-backend2:local}
    build: .
    command: celery -A CORE.celery_app worker --loglevel=INFO
    restart: unless-stopped
    init: true
    env_file: [.env]
    environment:
      PG_HOST: db
      PG_PORT: 5432
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
    depends_on:
      web:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck: {disable: true}
    networks: [codestra]

  celery_beat:
    image: ${BACKEND2_IMAGE:-codestra-backend2:local}
    build: .
    command: celery -A CORE.celery_app beat --scheduler=django_celery_beat.schedulers:DatabaseScheduler --loglevel=INFO
    restart: unless-stopped
    init: true
    env_file: [.env]
    environment:
      PG_HOST: db
      PG_PORT: 5432
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
    depends_on:
      web:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck: {disable: true}
    networks: [codestra]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose: ["5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [codestra]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    expose: ["6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD}' ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [codestra]

volumes:
  static_data:
  media_data:
  postgres_data:
  redis_data:

networks:
  codestra:
    driver: bridge
